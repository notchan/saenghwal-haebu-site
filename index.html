<h1>생활해부 자동화</h1>
<p>유튜브 채널 "생활해부"의 운영자가 자신의 채널에 영상을 예약 업로드하기 위해 쓰는 개인용 도구입니다.</p>
<p>이 도구는 운영자 본인의 유튜브 계정에만 연결되며, 다른 사람이 가입하거나 로그인해서 쓰는 서비스가 아닙니다.</p>
<h2>하는 일</h2>
<ul>
<li>운영자가 만든 영상을 운영자의 유튜브 채널에 올리고 공개 시각을 예약합니다.</li>
<li>올린 영상의 제목, 설명, 썸네일을 등록합니다.</li>
<li>운영자 채널의 영상 통계를 조회합니다.</li>
</ul>
